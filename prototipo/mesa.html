<style>

<div class="tela">

  <header class="topo">
    <button class="marca" id="marca" aria-controls="gaveta" title="Mapa das regras (tecla M)">
      <svg aria-hidden="true" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#d9a13b"/><path d="M18 64V41q0-8 8-9h4v32z" fill="#fff1d2"/><circle cx="22" cy="45" r="2.3" fill="#b06f1c"/><circle cx="26.5" cy="52" r="1.9" fill="#b06f1c"/><path d="M7 64l11-14 4 14z" fill="#3a2812"/><path d="M41 64L30 50l-4 14z" fill="#3a2812"/><path d="M23 34c0-7 5-11 12-11h7c6 0 10 3 10 7s-4 7-10 7H30c-4 0-7-1-7-3z" fill="#fff1d2"/><circle cx="49" cy="29.5" r="1" fill="#3a2812"/><circle cx="38" cy="29" r="2.1" fill="#3a2812"/><path d="M31 13.5V9M37 13.5V9" stroke="#fff1d2" stroke-width="2" stroke-linecap="round"/><circle cx="31" cy="8.5" r="1.8" fill="#3a2812"/><circle cx="37" cy="8.5" r="1.8" fill="#3a2812"/><path d="M28 23v-7q0-3 3-3h6q3 0 3 3v7z" fill="#3a2812"/><rect x="28" y="19.2" width="12" height="2.4" fill="#d9a13b"/><ellipse cx="34" cy="23.2" rx="12.5" ry="2.3" fill="#3a2812"/></svg>
      <div><h1>Inspetor <span>Jirafalis</span></h1><small id="sub"></small></div>
    </button>
    <div class="ronda" id="ronda" title="Clique na linha para criar um ponto de gravação; clique no losango para tirar."></div>
    <button class="disco" id="disco" title="Saúde do que está escrito nos campos"></button>
    <div class="comandos">
      <div class="agenda"><label class="switch" title="Gravação sozinha: grava as liberadas em cada ponto da linha do tempo"><input type="checkbox" id="ag-ativo" checked><i></i></label>
        <span>lê das</span><input type="time" id="ag-ini" value="08:00"><span>às</span><input type="time" id="ag-fim" value="19:00"></div>
      <a class="btn investigar" href="escala.html" title="Olhar a fundo onde está travando: todos os times, cada time, cada caso">◎ Investigar</a>
      <button class="btn" id="ler">↻ Ler agora</button>
      <button class="btn forte" id="gravar">➤ Gravar liberadas</button>
    </div>
  </header>
  <div id="avisos"></div>
  <div class="corpo" id="corpo">
    <aside class="gaveta" id="gaveta" aria-label="Mapa das regras">
      <div class="gaveta-topo"><h2>Mapa das regras</h2><button class="ico" id="fechar-mapa" title="Fechar o mapa (M)">⟨</button></div>
      <div class="gaveta-corpo" id="mapa"></div>
    </aside>
    <main class="mesa" id="mesa">
      <section class="raia" id="raia-mud" style="--cor:var(--mud)"></section>
      <section class="raia" id="raia-com" style="--cor:var(--com)"></section>
      <section class="raia" id="raia-cam" style="--cor:var(--cam)"></section>
    </main>
  </div>
  <footer class="rodape" id="rodape"></footer>
</div>
<div class="fundo" id="fundo"></div>
<section class="janela" id="janela" role="dialog" aria-modal="true"></section>
<div class="confirmar" id="confirmar"><div></div></div>
<div id="toasts" aria-live="polite"></div>
<script src="mesa-dados.js"></script>
<script src="mesa.js"></script>
