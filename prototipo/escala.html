<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jirafalis · Mapa de atuação em escala (protótipo C)</title>
<!-- Inspetor Jirafalis · protótipo de interface. Dados fictícios. © Sidney de Araújo Silva. -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap");
:root { --chao: #17120c; --raia: #211a12; --alto: #2c2319; --linha: #3a2e21; --ink: #f3e9da; --mudo: #b2a28b; --apagado: #7a6c5a;
  --ambar: #e8b456; --acacia: #a5d36c; --perigo: #f2a38a; --fio: #e06c4f; --sobre-cor: #241805; --ceu: #120e09; --sombra: 0 18px 48px rgba(0,0,0,.45); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--chao); color: var(--ink); font: 14px/1.4 "Atkinson Hyperlegible", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
.tela { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 10px 12px; }
.topo { display: flex; gap: 14px; align-items: center; padding: 6px 14px 6px 6px; border-radius: 20px; background: var(--raia); min-height: 58px; }
.marca { display: flex; gap: 10px; align-items: center; }
.marca svg { width: 40px; height: 40px; }
.marca h1 { font: 700 19px/1 "Bricolage Grotesque", sans-serif; margin: 0; letter-spacing: -.02em; } .marca h1 span { color: var(--ambar); }
.marca small { color: var(--mudo); font-size: 12.5px; }
/* Alarmes do topo: só existem quando há algo crítico ou um padrão */
.alarmes { display: flex; gap: 8px; margin-left: auto; align-items: center; }
.alarme { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; border-radius: 12px; padding: 6px 12px; border: 1px solid; background: transparent; font-size: 13px; }
.alarme b { font: 700 18px/1 "Bricolage Grotesque"; }
.alarme.al-crit { color: var(--perigo); border-color: rgba(242,163,138,.5); background: rgba(242,163,138,.08); }
.alarme.al-pad { color: var(--ambar); border-color: rgba(232,180,86,.45); background: rgba(232,180,86,.06); }
.alarme .pulso { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulsa 1.8s ease-in-out infinite; }
@keyframes pulsa { 50% { opacity: .3; } }
.calmo { margin-left: auto; color: var(--acacia); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.pilula { font-size: 12.5px; border: 1px solid var(--linha); border-radius: 99px; padding: 4px 11px; color: var(--mudo); background: transparent; }
.pilula[aria-pressed=true] { border-color: var(--ambar); color: var(--ambar); font-weight: 700; }

.corpo { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 10px; min-height: 0; }
.ceu { position: relative; background: radial-gradient(ellipse at 50% 130%, #2a1f12 0%, var(--ceu) 62%); border-radius: 20px; overflow: hidden; min-height: 0; }
.ceu svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.etapa-nome { font: 650 12.5px "Bricolage Grotesque", sans-serif; fill: var(--ink); text-anchor: middle; }
.etapa-sub { font-size: 11px; fill: var(--mudo); text-anchor: middle; }
.etapa-sub.forte { fill: var(--ambar); font-weight: 700; }
.time-nome { font: 650 13px "Bricolage Grotesque", sans-serif; fill: var(--ink); }
.linha-time .fundo { fill: transparent; } .linha-time:hover .fundo { fill: rgba(243,233,218,.03); }
.linha-time.aberta .fundo { fill: rgba(232,180,86,.045); }
.time-alvo { cursor: pointer; } .time-alvo:hover .time-nome { fill: var(--ambar); }
.guia { stroke: var(--linha); stroke-width: 1; }
.gargalo { fill: rgba(232,180,86,.06); stroke: rgba(232,180,86,.18); stroke-dasharray: 2 4; }
.poeira circle { fill: #f3e9da; }
.ceu.sobrio .poeira { display: none; }
.pessoa { cursor: pointer; }
.ponto.saudavel { fill: #d9cdb8; fill-opacity: .5; }
.ponto.atencao { fill: var(--ambar); }
.ponto.critico { fill: #ffe1b8; }
.halo.critico { fill: var(--perigo); fill-opacity: .3; animation: respira 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.halo.atencao { fill: var(--ambar); fill-opacity: .14; }
@keyframes respira { 50% { transform: scale(1.35); fill-opacity: .1; } }
.anel-sel { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.rotulo { font: 650 11.5px "Bricolage Grotesque", sans-serif; fill: var(--ink); pointer-events: none; }
.rotulo.mudo { fill: var(--apagado); font-weight: 400; }
.esmaecido { opacity: .14; }
.marca-padrao { fill: none; stroke: var(--ambar); stroke-width: 1.4; stroke-dasharray: 3 3; }
.tl-titulo { font: 650 12px "Bricolage Grotesque"; fill: var(--mudo); }
.tl-eixo { stroke: var(--linha); }
.tl-dia { font-size: 10.5px; fill: var(--apagado); text-anchor: middle; }
.tl-espera { stroke-width: 2; stroke-linecap: round; }
.tl-marca { cursor: pointer; }

.dica { position: absolute; pointer-events: none; background: var(--ink); color: var(--chao); border-radius: 12px; padding: 8px 11px; font-size: 13px; box-shadow: var(--sombra);
  display: none; gap: 9px; align-items: center; max-width: 300px; z-index: 3; }
.dica.on { display: flex; } .dica b { font: 700 13px "Bricolage Grotesque"; display: block; }
.legenda { position: absolute; left: 22px; bottom: 12px; display: flex; flex-direction: column; gap: 1px; font-size: 11.5px; color: var(--mudo); }
.legenda i { display: inline-block; vertical-align: -1px; margin-right: 4px; border-radius: 50%; }

.lado { background: var(--raia); border-radius: 20px; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; scrollbar-color: var(--linha) transparent; }
.lado h2 { font: 700 15px "Bricolage Grotesque"; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
.lado h2 .n { font-size: 12px; color: var(--mudo); font-weight: 400; }
.lado h3 { font: 650 12px "Bricolage Grotesque"; color: var(--mudo); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; }
.lado p.sub { margin: 0 0 8px; color: var(--mudo); font-size: 12.5px; }
.mudo { color: var(--mudo); }
.caso, .padrao { display: grid; gap: 4px; text-align: left; width: 100%; border: 1px solid var(--linha); background: var(--alto); border-radius: 12px; padding: 9px 11px; margin-bottom: 6px; }
.caso:hover, .padrao:hover { border-color: var(--apagado); }
.padrao.sel { border-color: var(--ambar); }
.caso .topo-caso { display: flex; gap: 8px; align-items: center; }
.caso .topo-caso b { font: 650 13px "Bricolage Grotesque"; } .caso small, .padrao small { color: var(--mudo); font-size: 12px; }
.caso .pq { font-size: 12.5px; font-style: italic; }
.espera { font-size: 11.5px; color: var(--perigo); font-weight: 700; }
.padrao { border-left: 3px solid var(--ambar); }
.padrao b { font: 650 13px "Bricolage Grotesque"; }
.padrao .rostos { display: flex; gap: 4px; flex-wrap: wrap; }
.padrao .rostos span { font-size: 11px; border: 1px solid var(--linha); border-radius: 99px; padding: 0 7px; color: var(--mudo); }
.padrao .acao { justify-self: start; margin-top: 4px; border: 1px solid var(--ambar); color: var(--ambar); background: transparent; border-radius: 9px; padding: 3px 9px; font-size: 12px; font-weight: 700; }
.sinal { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; white-space: nowrap; margin-left: auto; }
.sinal.critico { background: var(--perigo); color: var(--chao); } .sinal.atencao { background: rgba(232,180,86,.22); color: var(--ambar); }
.sinal.saudavel { background: rgba(165,211,108,.14); color: var(--acacia); }
.tag { font-size: 11px; color: var(--mudo); border: 1px solid var(--linha); border-radius: 99px; padding: 0 7px; }
.rosto { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 11.5px "Bricolage Grotesque"; color: var(--sobre-cor); flex: none; }
/* detalhe da pessoa (o mesmo do protótipo B) */
.voltar { border: 0; background: none; color: var(--mudo); padding: 0; font-size: 12.5px; text-align: left; }
.cab { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.cab .rosto { width: 40px; height: 40px; font-size: 14px; } .cab h2 { font-size: 17px; }
.trilha { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 13px; background: var(--alto); border-radius: 12px; padding: 8px 10px; }
.trilha .niv { font-size: 10.5px; color: var(--apagado); text-transform: uppercase; display: block; }
.trilha .seta { color: var(--apagado); } .trilha .aqui { color: var(--ambar); font-weight: 700; }
.lista-fio { list-style: none; margin: 0; padding: 0 0 0 4px; }
.lista-fio li { position: relative; padding: 0 0 9px 20px; font-size: 13px; }
.lista-fio li::before { content: ""; position: absolute; left: 4px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--apagado); }
.lista-fio li::after { content: ""; position: absolute; left: 7.5px; top: 15px; bottom: 0; width: 1px; background: var(--linha); }
.lista-fio li:last-child::after { display: none; } .lista-fio li.forte::before { background: var(--fio); }
.barras { display: grid; gap: 5px; }
.barra { display: grid; grid-template-columns: 118px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 12.5px; }
.barra .trilho { height: 8px; border-radius: 4px; background: var(--linha); position: relative; }
.barra .trilho i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--mudo); }
.barra .trilho i.passou { background: var(--ambar); } .barra .trilho i.muito { background: var(--perigo); }
.barra .trilho u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .6; }
.barra span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--mudo); }
.leitura { background: var(--alto); border-left: 3px solid var(--ambar); border-radius: 10px; padding: 9px 11px; font-size: 13px; }
.leitura.processo { border-left-color: var(--fio); }
textarea { width: 100%; min-height: 76px; resize: vertical; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--chao); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 10px; }
.botoes { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha); background: var(--alto); border-radius: 11px; padding: 6px 11px; font-size: 13px; }
.btn:hover { border-color: var(--apagado); }
.btn.forte { background: var(--ambar); border-color: var(--ambar); color: var(--sobre-cor); font-weight: 700; }
#toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--chao); padding: 10px 14px; border-radius: 12px; font-size: 13px; box-shadow: var(--sombra); display: none; max-width: 400px; z-index: 9; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.telas { display: flex; gap: 4px; margin-left: 14px; } .telas a { font-size: 12.5px; color: var(--mudo); padding: 4px 10px; border-radius: 99px; border: 1px solid transparent; text-decoration: none; } .telas a:hover { border-color: var(--linha); } .telas a[aria-current] { color: var(--ink); border-color: var(--linha); background: var(--alto); }
</style>

<body>
<div class="tela">
  <header class="topo">
    <div class="marca">
      <svg aria-hidden="true" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#d9a13b"/><path d="M18 64V41q0-8 8-9h4v32z" fill="#fff1d2"/><path d="M7 64l11-14 4 14z" fill="#3a2812"/><path d="M41 64L30 50l-4 14z" fill="#3a2812"/><path d="M23 34c0-7 5-11 12-11h7c6 0 10 3 10 7s-4 7-10 7H30c-4 0-7-1-7-3z" fill="#fff1d2"/><circle cx="38" cy="29" r="2.1" fill="#3a2812"/><path d="M28 23v-7q0-3 3-3h6q3 0 3 3v7z" fill="#3a2812"/><rect x="28" y="19.2" width="12" height="2.4" fill="#d9a13b"/><ellipse cx="34" cy="23.2" rx="12.5" ry="2.3" fill="#3a2812"/></svg>
      <div><h1>Inspetor <span>Jirafalis</span></h1><small>Mapa de atuação · todos os times</small></div>
    </div>
    <nav class="telas" aria-label="Telas do protótipo"><a href="mesa.html">Mesa do dia</a><a href="escala.html" aria-current="page">Investigar</a><a href="regras.html">Regras e cérebro</a><a href="onboarding.html">Onboarding</a><a href="../index.html">Apresentação</a><span style="color:var(--apagado);margin:0 4px">›</span><a href="escala.html" aria-current="page" style="font-size:12px">Visão geral</a><a href="constelacao.html" style="font-size:12px">Time</a></nav>
    <div id="alarmes" class="alarmes"></div>
    <button class="pilula" id="so-casos" aria-pressed="false">Só os casos</button>
    <button class="pilula" id="sobrio" aria-pressed="false">Modo sóbrio</button>
  </header>
  <main class="corpo">
    <section class="ceu" id="ceu" aria-label="Céu de todos os times">
      <svg id="mapa" role="img" aria-label="Uma linha por time; pontos são pessoas; a cauda é o tempo parado; brilho indica caso aberto"></svg>
      <div class="legenda" aria-hidden="true">
        <span><i style="width:6px;height:6px;background:#d9cdb8;opacity:.6"></i>andando bem</span>
        <span><i style="width:8px;height:8px;background:var(--ambar)"></i>passou da referência</span>
        <span><i style="width:9px;height:9px;background:#ffe1b8;box-shadow:0 0 0 3px rgba(242,163,138,.4)"></i>pede uma pergunta</span>
        <span>cauda = tempo parado na etapa</span>
      </div>
      <div class="dica" id="dica" role="tooltip"></div>
    </section>
    <aside class="lado" id="lado" aria-live="polite"></aside>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="analises.js"></script>
<script>
// ---------- Atmosfera do processo e dados fictícios ----------
const ETAPAS = ["A fazer", "Em desenvolvimento", "Em revisão (PR)", "Em testes", "Em validação", "Pronto"];
const REF = [3, 4, 2, 2, 2, 0];
const HOJE = 10;
// [time, épico, [nome, etapa, dias na etapa, marca, história, task]] · marca: d = PR mergeado com card parado, q = testes sem dono, s = sem item novo
const DADOS = [
  ["Pagamentos", "Cobrança recorrente", [["André Souza", 1, 10, "d", "Estorno pelo painel", "Criação de endpoint de estorno"], ["Ana Lima", 4, 1, "", "Retentar cartão recusado", "Fila de retentativa"], ["Bruno Reis", 2, 3, "", "Recibo por e-mail", "Template do recibo"]]],
  ["Onboarding", "Cadastro em 3 passos", [["Carla Mendes", 1, 2, "", "Validar documento", "Leitura do CPF"], ["Diego Prado", 3, 5, "q", "Selfie com documento", "Captura da selfie"], ["Elisa Rocha", 5, 1, "", "Boas-vindas", "E-mail de boas-vindas"]]],
  ["Plataforma", "Observabilidade", [["Fábio Nunes", 1, 1, "", "Alertas de latência", "Painel de latência"], ["Gabriela Dias", 4, 4, "", "Logs estruturados", "Padrão de log"], ["Heitor Alves", 5, 3, "s", "Métricas de fila", "Contador de mensagens"]]],
  ["Checkout", "Checkout em 1 clique", [["Igor Campos", 1, 7, "d", "Cartão salvo", "Tokenização do cartão"], ["Júlia Ramos", 2, 1, "", "Cupom no carrinho", "Validação do cupom"], ["Kauê Lopes", 1, 2, "", "Frete na hora", "Cálculo de frete"]]],
  ["Antifraude", "Score em tempo real", [["Lara Pinto", 3, 4, "q", "Regras por região", "Bloqueio por CEP"], ["Marcos Teles", 1, 3, "", "Lista de exceções", "Cadastro de exceção"], ["Nina Duarte", 2, 1, "", "Alerta ao analista", "Fila do analista"]]],
  ["Mobile", "App 3.0", [["Otávio Melo", 1, 6, "d", "Login por biometria", "Biometria no Android"], ["Paula Freitas", 3, 1, "", "Modo escuro", "Tema escuro nas telas"], ["Rafael Costa", 1, 1, "", "Notificações", "Push de pedido"]]],
  ["Dados", "Painel do cliente", [["Sara Moura", 3, 6, "q", "Exportar CSV", "Exportação assíncrona"], ["Tiago Neves", 4, 1, "", "Filtro por período", "Seletor de datas"], ["Úrsula Brito", 1, 4, "", "Cache das consultas", "Cache por cliente"]]],
  ["Parcerias", "Marketplace", [["Vítor Lemos", 1, 9, "d", "Catálogo do parceiro", "Importação do catálogo"], ["Wanda Sales", 2, 2, "", "Repasse", "Cálculo do repasse"], ["Yara Torres", 0, 1, "", "Contrato digital", "Assinatura do contrato"]]],
  ["Suporte interno", "Ferramentas do atendimento", [["Zeca Matos", 1, 3, "", "Busca de pedido", "Busca por CPF"], ["Bia Farias", 5, 1, "", "Macro de resposta", "Macros no chat"], ["Caio Vidal", 2, 1, "", "Histórico do cliente", "Linha do tempo do cliente"]]],
];
const CORES = ["#e8b456", "#6cc4b2", "#8fb6dc", "#a5d36c", "#f2a38a", "#d9a13b", "#c9b6e8", "#e8d48f", "#9fd6c6"];
const pessoas = [];
DADOS.forEach(([time, epico, devs], ti) => devs.forEach(([nome, etapa, dias, marca, historia, task], k) => {
  const id = pessoas.length, ref = REF[etapa], entra = HOJE - dias, num = 100 + id * 7, pr = 20 + id * 3;
  const primeiro = nome.split(" ")[0];
  // histórico: as etapas anteriores espalhadas antes da entrada na etapa atual
  const eventos = [];
  for (let e = 1; e < etapa; e++) eventos.push([Math.round(entra * (e - 1) / Math.max(etapa - 1, 1)), e]);
  eventos.push([entra, etapa]);
  const evid = [];
  let sinal = "saudavel", porque = `${ETAPAS[etapa]} · ${dias} d`, pergunta = "", leitura = "", tipo = "", acesoDesde = null;
  if (marca === "d") {
    const merge = Math.min(HOJE - 1, entra + Math.max(2, dias - 4));
    evid.push([entra + 2, `PR #${pr} aberto`, 2], [merge, `PR #${pr} mergeado`, 3], [Math.min(HOJE, merge + 1), "Deploy em homologação", 4]);
    sinal = "critico"; tipo = "processo"; acesoDesde = merge;
    porque = `${ETAPAS[etapa]} há ${dias} d, mas o PR já foi mergeado`;
    leitura = "Provável falha do processo, não da pessoa: o trabalho andou (PR mergeado e deploy), o card não. O card deveria estar em Em testes.";
    pergunta = `${primeiro}, vi aqui que você está há ${dias} dias úteis em "${task}". Isso está correto? Vi também que o PR #${pr} já foi mergeado.`;
  } else if (marca === "q") {
    evid.push([entra, `PR #${pr} mergeado`, 3], [entra, "Em testes sem responsável de QA", 3]);
    sinal = dias >= ref * 2.5 ? "critico" : "atencao"; tipo = "processo"; acesoDesde = entra + Math.ceil(ref * 1.25);
    porque = `${ETAPAS[etapa]} há ${dias} d, sem responsável de testes`;
    leitura = "Provável fila sem dono: o desenvolvimento terminou e ninguém pegou o teste.";
    pergunta = `${primeiro}, o #${num} está em testes há ${dias} dias úteis. Alguém está testando ou ele ficou na fila?`;
  } else if (marca === "s") {
    evid.push([entra, "Publicado em produção", 5]);
    sinal = "atencao"; tipo = "pessoa"; acesoDesde = entra + 2; porque = `Sem item novo há ${dias} d`;
    leitura = "Pode ser trabalho fora do quadro (suporte, estudo, reunião) ou falta de item pronto para puxar.";
    pergunta = `${primeiro}, vi que você terminou o #${num} e está sem item novo há ${dias} dias úteis. Está em algo que não aparece no quadro?`;
  } else {
    if (etapa >= 2) evid.push([eventos.find(e => e[1] === 2)?.[0] ?? entra, `PR #${pr} aberto`, 2]);
    if (etapa >= 3) evid.push([eventos.find(e => e[1] === 3)?.[0] ?? entra, `PR #${pr} mergeado`, 3]);
    if (etapa === 1) evid.push([HOJE - 1, `${1 + id % 4} commits na branch feature/${num}`, 1]);
    if (ref && dias >= ref * 1.25) {
      sinal = dias >= ref * 2.5 ? "critico" : "atencao"; tipo = "pessoa"; acesoDesde = entra + Math.ceil(ref * 1.25);
      porque = `${ETAPAS[etapa]} há ${dias} d (referência: ${ref})`;
      leitura = "Passou da referência da etapa. Pode ser um item maior que o normal, um bloqueio ou espera por outra pessoa.";
      pergunta = `${primeiro}, o #${num} está na etapa "${ETAPAS[etapa]}" há ${dias} dias úteis. Tem algo travando ou alguém que precisa ajudar?`;
    }
  }
  const tempos = eventos.map((e, i) => ({ etapa: e[1], dias: (i + 1 < eventos.length ? eventos[i + 1][0] : HOJE) - e[0] }));
  pessoas.push({ id: "p" + id, nome, primeiro, time, ti, k, etapa, dias, marca, sinal, porque, pergunta, leitura, tipo, eventos, evid, tempos,
    item: { epico, historia, task: `#${num} ${task}` }, cor: CORES[id % CORES.length], iniciais: nome.split(" ").map(s => s[0]).join(""),
    acesoDesde, espera: acesoDesde === null ? 0 : HOJE - acesoDesde,
    peso: (sinal === "critico" ? 100 : sinal === "atencao" ? 50 : 0) + (acesoDesde === null ? 0 : (HOJE - acesoDesde) * 5) });
}));

// Padrões: o mesmo desvio em vários times é falha do processo
function padroes() {
  const lista = [];
  const div = pessoas.filter(p => p.marca === "d");
  if (div.length >= 2) lista.push({ id: "div", quem: div, desde: div.map(p => p.acesoDesde).sort((a, b) => a - b)[1], titulo: "PR mergeado com card parado em desenvolvimento",
    detalhe: `${div.length} casos em ${new Set(div.map(p => p.time)).size} times.`,
    leitura: "Não são 4 pessoas atrasadas: o passo \"mover o card depois do merge\" não está acontecendo.",
    acao: "Criar regra candidata", toast: 'Regra candidata criada (D1, padrão PR-06): "PR mergeado + card em desenvolvimento → mover para Em testes". Nasce júnior, em simulação, para os 4 times.' });
  const fila = pessoas.filter(p => p.marca === "q");
  if (fila.length >= 2) lista.push({ id: "fila", quem: fila, desde: fila.map(p => p.acesoDesde).sort((a, b) => a - b)[1], titulo: "Fila de testes sem dono",
    detalhe: `${fila.length} itens em "Em testes" acima da referência, em ${new Set(fila.map(p => p.time)).size} times.`,
    leitura: "Gargalo na mesma etapa em vários times: falta quem teste, não falta quem desenvolva.",
    acao: "Avisar a liderança de QA", toast: "Aviso preparado para a liderança de QA (rascunho no Teams/Slack, espera o Liberar)." });
  return lista;
}
const PADROES = padroes();
const padraoDe = p => PADROES.find(x => x.quem.includes(p));

// ---------- Estado ----------
let aberto = null, selecionado = null, focoPadrao = null, soCasos = false, sobrio = false;
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, pai) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (pai) pai.appendChild(e); return e; };
const rosto = p => `<span class="rosto" style="background:${p.cor}" aria-hidden="true">${p.iniciais}</span>`;
const NOME_SINAL = { critico: "pede uma pergunta", atencao: "passou da referência", saudavel: "andando bem" };

// ---------- O céu ----------
function desenhar() {
  const ceu = $("#ceu"), W = ceu.clientWidth, H = ceu.clientHeight, svg = $("#mapa");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = "";
  ceu.classList.toggle("sobrio", sobrio);
  const defs = el("defs", {}, svg);
  [["critico", "#f2a38a"], ["atencao", "#e8b456"]].forEach(([n, c]) => {
    const g = el("linearGradient", { id: "cauda-" + n, x1: 0, x2: 1, y1: 0, y2: 0 }, defs);
    el("stop", { offset: 0, "stop-color": c, "stop-opacity": 0 }, g); el("stop", { offset: 1, "stop-color": c, "stop-opacity": .75 }, g);
  });
  // poeira de estrelas: decorativa, some no modo sóbrio
  const poeira = el("g", { class: "poeira", "aria-hidden": "true" }, svg);
  let s = 11; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 160; i++) el("circle", { cx: rnd() * W, cy: rnd() * H, r: rnd() * .9 + .2, "fill-opacity": (rnd() * .16 + .03).toFixed(2) }, poeira);

  const ESQ = 190, DIR = W - 40, colW = (DIR - ESQ) / ETAPAS.length, X = i => ESQ + colW * (i + .5);
  const TOPO = 78, TL = 150, BASE = H - TL - 10;
  const nT = DADOS.length, ALT_ABERTA = 120;
  const altFechada = aberto === null ? (BASE - TOPO) / nT : (BASE - TOPO - ALT_ABERTA) / (nT - 1);
  const ys = []; let yy = TOPO; DADOS.forEach((_, ti) => { ys[ti] = yy; yy += ti === aberto ? ALT_ABERTA : altFechada; });

  // cabeçalho das colunas: nome + acúmulo (barra) + quantos times acima da referência
  const maxItens = Math.max(...ETAPAS.map((_, e) => pessoas.filter(p => p.etapa === e).length));
  ETAPAS.forEach((n, e) => {
    const nos = pessoas.filter(p => p.etapa === e), acima = nos.filter(p => p.sinal !== "saudavel"), times = new Set(acima.map(p => p.time)).size;
    if (times >= 3) el("rect", { x: X(e) - colW * .45, y: TOPO - 4, width: colW * .9, height: BASE - TOPO + 8, rx: 12, class: "gargalo" }, svg);
    const t = el("text", { x: X(e), y: 24, class: "etapa-nome" }, svg); t.textContent = n;
    const bw = colW * .6, bx = X(e) - bw / 2, by = 33;
    el("rect", { x: bx, y: by, width: bw, height: 5, rx: 2.5, fill: "#3a2e21" }, svg);
    el("rect", { x: bx, y: by, width: bw * nos.length / maxItens, height: 5, rx: 2.5, fill: "#7a6c5a" }, svg);
    if (acima.length) el("rect", { x: bx, y: by, width: bw * acima.length / maxItens, height: 5, rx: 2.5, fill: times >= 3 ? "#e8b456" : "#b2a28b" }, svg);
    const t2 = el("text", { x: X(e), y: 54, class: "etapa-sub" + (times >= 3 ? " forte" : "") }, svg);
    t2.textContent = `${nos.length} ${nos.length === 1 ? "item" : "itens"}` + (times ? ` · ${times} ${times > 1 ? "times" : "time"} acima` : "");
    if (times >= 3) { const t3 = el("text", { x: X(e), y: 68, class: "etapa-sub forte" }, svg); t3.textContent = "gargalo do processo"; }
  });

  DADOS.forEach(([time], ti) => {
    const y = ys[ti], h = ti === aberto ? ALT_ABERTA : altFechada, cy = y + h / 2, dele = pessoas.filter(p => p.ti === ti);
    const g = el("g", { class: "linha-time" + (aberto === ti ? " aberta" : "") }, svg);
    el("rect", { x: 6, y: y + 1, width: W - 12, height: h - 2, rx: 10, class: "fundo" }, g);
    // nome do time + uma bolinha por pessoa, na cor do sinal (o "quantos" sem precisar de número)
    const alvo = el("g", { class: "time-alvo", tabindex: 0, role: "button", "aria-label": `${time}: abrir a linha do time` }, g);
    el("rect", { x: 10, y: cy - 20, width: ESQ - 24, height: 40, fill: "transparent" }, alvo);
    const tn = el("text", { x: 22, y: cy - 3, class: "time-nome" }, alvo); tn.textContent = time;
    dele.forEach((p, k) => el("circle", { cx: 26 + k * 13, cy: cy + 11, r: 4, fill: { critico: "#f2a38a", atencao: "#e8b456", saudavel: "#5c5040" }[p.sinal] }, alvo));
    const seta = el("text", { x: ESQ - 28, y: cy + 4, class: "etapa-sub" }, alvo); seta.textContent = aberto === ti ? "▾" : "▸";
    const abrir = () => { aberto = aberto === ti ? null : ti; desenhar(); };
    alvo.addEventListener("click", abrir);
    alvo.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); abrir(); } });

    const faixas = aberto === ti ? dele.map((_, k) => y + 24 + k * 36) : null;
    (faixas || [cy]).forEach(fy => el("line", { x1: ESQ, x2: DIR, y1: fy, y2: fy, class: "guia", "stroke-dasharray": faixas ? "1 5" : "" }, g));
    const naEtapa = {};
    dele.forEach((p, k) => {
      const j = aberto === ti ? 0 : ((naEtapa[p.etapa] = (naEtapa[p.etapa] ?? -1) + 1));
      const x = X(p.etapa) + j * 22, py = faixas ? faixas[k] : cy;
      p._x = x; p._y = py;
      const apaga = (soCasos && p.sinal === "saudavel") || (focoPadrao && !focoPadrao.quem.includes(p));
      const gp = el("g", { class: "pessoa" + (apaga ? " esmaecido" : ""), tabindex: 0, role: "button", "aria-label": `${p.nome}, ${time}: ${p.porque}` }, g);
      const r = { saudavel: 3.5, atencao: 5.5, critico: 7 }[p.sinal];
      // cauda de cometa: o comprimento é o tempo parado na etapa (comparado à referência)
      if (p.sinal !== "saudavel") {
        const ref = REF[p.etapa] || 2, len = Math.min(p.dias / ref, 4) / 4 * colW * .85;
        el("path", { d: `M${x - len},${py} L${x},${py - r * .8} L${x},${py + r * .8} Z`, fill: `url(#cauda-${p.sinal})` }, gp);
        el("circle", { cx: x, cy: py, r: r * 2.4, class: "halo " + p.sinal }, gp);
      }
      el("circle", { cx: x, cy: py, r, class: "ponto " + p.sinal }, gp);
      if (selecionado === p.id) el("circle", { cx: x, cy: py, r: r + 6, class: "anel-sel" }, gp);
      el("circle", { cx: x, cy: py, r: 16, fill: "transparent" }, gp);
      if (p.sinal !== "saudavel" || aberto === ti) {
        const t = el("text", { x: x + r + 6, y: py + 4, class: "rotulo" + (p.sinal === "saudavel" ? " mudo" : "") }, gp);
        t.textContent = aberto === ti ? `${p.primeiro} · ${p.porque}` : p.primeiro;
      }
      gp.addEventListener("mouseenter", ev => dica(p, ev));
      gp.addEventListener("mousemove", ev => moverDica(ev));
      gp.addEventListener("mouseleave", () => $("#dica").classList.remove("on"));
      gp.addEventListener("click", () => selecionar(p.id));
      gp.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selecionar(p.id); } });
    });
  });
  if (focoPadrao) focoPadrao.quem.forEach(p => el("circle", { cx: p._x, cy: p._y, r: 17, class: "marca-padrao" }, svg));

  // linha do tempo dos sinais: quando cada um acendeu e há quanto tempo espera resposta
  const ty = H - 44, X0 = ESQ, X1 = DIR, xd = d => X0 + (X1 - X0) * d / HOJE;
  el("line", { x1: 8, x2: W - 8, y1: H - TL, y2: H - TL, stroke: "#3a2e21" }, svg);
  const tt = el("text", { x: 22, y: H - TL + 24, class: "tl-titulo" }, svg); tt.textContent = "Quando cada sinal acendeu";
  const ts = el("text", { x: 22, y: H - TL + 40, class: "etapa-sub", "text-anchor": "start" }, svg); ts.style.textAnchor = "start"; ts.textContent = "e há quanto tempo espera";
  el("line", { x1: X0, x2: X1, y1: ty, y2: ty, class: "tl-eixo" }, svg);
  for (let d = 0; d <= HOJE; d += 2) { const t = el("text", { x: xd(d), y: ty + 18, class: "tl-dia" }, svg); t.textContent = d === HOJE ? "hoje" : `há ${HOJE - d} d`; }
  const acesos = pessoas.filter(p => p.acesoDesde !== null).sort((a, b) => a.acesoDesde - b.acesoDesde || b.peso - a.peso);
  const passo = Math.min(11, (TL - 52) / acesos.length);
  acesos.forEach((p, n) => {
    const x = xd(p.acesoDesde), y = H - TL + 16 + n * passo, cor = p.sinal === "critico" ? "#f2a38a" : "#e8b456";
    const apaga = (soCasos && false) || (focoPadrao && !focoPadrao.quem.includes(p));
    const gm = el("g", { class: "tl-marca" + (apaga ? " esmaecido" : "") }, svg);
    el("line", { x1: x, x2: xd(HOJE), y1: y, y2: y, stroke: cor, "stroke-opacity": .28, class: "tl-espera" }, gm);
    el("circle", { cx: x, cy: y, r: selecionado === p.id ? 5 : 3.5, fill: cor, stroke: selecionado === p.id ? "#f3e9da" : "none" }, gm);
    const nm = el("text", { x: x - 8, y: y + 3.5, class: "tl-dia", "text-anchor": "end" }, gm); nm.style.textAnchor = "end"; nm.style.fontSize = "9.5px"; nm.textContent = p.primeiro;
    if (p.espera >= 2) { const es = el("text", { x: xd(HOJE) + 8, y: y + 3.5, class: "tl-dia" }, gm); es.style.textAnchor = "start"; es.textContent = p.espera + " d"; es.style.fill = cor; }
    const ti = el("title", {}, gm); ti.textContent = `${p.nome}: acendeu há ${p.espera} d · ${p.porque}`;
    gm.addEventListener("click", () => selecionar(p.id));
  });
  PADROES.forEach(pd => {
    const x = xd(pd.desde), y = ty;
    const gm = el("g", { class: "tl-marca" }, svg);
    el("path", { d: `M${x},${y - 6} L${x + 6},${y} L${x},${y + 6} L${x - 6},${y} Z`, fill: "#e8b456" }, gm);
    const ti = el("title", {}, gm); ti.textContent = `Padrão formado há ${HOJE - pd.desde} d: ${pd.titulo}`;
    gm.addEventListener("click", () => focar(pd.id));
  });
}
function dica(p, ev) { const d = $("#dica"); d.innerHTML = `${rosto(p)}<div><b>${p.nome}</b>${p.porque}</div>`; d.classList.add("on"); moverDica(ev); }
function moverDica(ev) {
  const c = $("#ceu").getBoundingClientRect(), d = $("#dica");
  let x = ev.clientX - c.left + 14; const y = ev.clientY - c.top + 14; if (x + 300 > c.width) x -= 320;
  d.style.left = x + "px"; d.style.top = y + "px";
}

// ---------- Topo: só alarma quando há algo crítico ----------
function alarmes() {
  const criticos = pessoas.filter(p => p.sinal === "critico");
  const novosPad = PADROES;
  const a = $("#alarmes");
  if (!criticos.length && !novosPad.length) { a.innerHTML = `<span class="calmo">● Tudo dentro da referência</span>`; return; }
  a.innerHTML = (criticos.length ? `<button class="alarme al-crit" id="al-crit"><span class="pulso"></span><b>${criticos.length}</b> pedem uma pergunta</button>` : "")
    + (novosPad.length ? `<button class="alarme al-pad" id="al-pad"><b>${novosPad.length}</b> ${novosPad.length > 1 ? "padrões" : "padrão"} do processo</button>` : "");
  $("#al-crit")?.addEventListener("click", () => { soCasos = true; $("#so-casos").setAttribute("aria-pressed", true); selecionar(null); });
  $("#al-pad")?.addEventListener("click", () => focar(PADROES[0].id));
}

// ---------- Lateral ----------
function lateral() {
  const lado = $("#lado");
  if (selecionado) return detalhe(pessoas.find(p => p.id === selecionado));
  const isolados = pessoas.filter(p => p.sinal !== "saudavel" && !padraoDe(p)).sort((a, b) => b.peso - a.peso);
  lado.innerHTML = `<div><h2>Padrões entre times <span class="n">${PADROES.length}</span></h2><p class="sub">O mesmo desvio em vários times é falha do processo. Resolver um padrão fecha vários casos de uma vez.</p>
    ${PADROES.map(pd => `<div class="padrao${focoPadrao?.id === pd.id ? " sel" : ""}" data-padrao="${pd.id}" role="button" tabindex="0"><b>${pd.titulo}</b><small>${pd.detalhe} Formado há ${HOJE - pd.desde} dias.</small>
      <span style="font-size:12.5px">${pd.leitura}</span><span class="rostos">${pd.quem.map(p => `<span>${p.primeiro} · ${p.time}</span>`).join("")}</span>
      <button class="acao" data-acao="${pd.id}">${pd.acao}</button></div>`).join("")}</div>
    <div><h2>Onde atuar agora <span class="n">${isolados.length} casos isolados</span></h2><p class="sub">Fora dos padrões: uma pergunta para cada pessoa. Clique para ver o caso completo.</p>
    ${isolados.map(c => `<button class="caso" data-id="${c.id}"><span class="topo-caso"><b>${c.primeiro}</b><span class="tag">${c.time}</span><span class="sinal ${c.sinal}">${NOME_SINAL[c.sinal]}</span></span>
      <small>${c.porque}</small>${c.espera >= 2 ? `<span class="espera">Sinal aceso há ${c.espera} dias, sem resposta</span>` : ""}<span class="pq">“${c.pergunta}”</span></button>`).join("")}</div>`;
  lado.querySelectorAll(".caso").forEach(b => b.onclick = () => selecionar(b.dataset.id));
  lado.querySelectorAll("[data-padrao]").forEach(b => b.onclick = ev => {
    if (ev.target.dataset.acao) { toast(PADROES.find(x => x.id === ev.target.dataset.acao).toast); return; }
    focar(b.dataset.padrao);
  });
}
function detalhe(p) {
  const pd = padraoDe(p), maxD = Math.max(...p.tempos.map(t => Math.max(t.dias, REF[t.etapa])), 1);
  const linhas = [...p.eventos.map(e => [e[0], `card foi para <b>${ETAPAS[e[1]]}</b>`, ""]), ...p.evid.map(e => [e[0], e[1], e[2] > p.etapa ? "forte" : ""])].sort((a, b) => a[0] - b[0]);
  $("#lado").innerHTML = `<button class="voltar" id="voltar">← Voltar aos casos</button>
    <div class="cab">${rosto(p)}<div><h2>${p.nome}</h2><span class="tag">${p.time}</span></div><span class="sinal ${p.sinal}">${NOME_SINAL[p.sinal]}</span></div>
    ${pd ? `<div class="padrao" style="margin:0"><small>Faz parte do padrão</small><b>${pd.titulo}</b><small>${pd.detalhe} Resolver o padrão fecha este caso também.</small></div>` : ""}
    <div><h3>Onde está</h3><div class="trilha"><span><span class="niv">Épico</span>${p.item.epico}</span><span class="seta">›</span>
      <span><span class="niv">História</span>${p.item.historia}</span><span class="seta">›</span><span class="aqui"><span class="niv">Task</span>${p.item.task}</span></div>
      <p style="margin:6px 0 0">${p.porque}${p.espera ? ` · sinal aceso há ${p.espera} d` : ""}</p></div>
    <div><h3>O fio, em ordem</h3><ul class="lista-fio">${linhas.map(l => `<li class="${l[2]}">${l[0] === HOJE ? "Hoje" : "Dia " + l[0]}: ${l[1]}</li>`).join("")}<li>Hoje: card em <b>${ETAPAS[p.etapa]}</b></li></ul></div>
    <div><h3>Tempo em cada etapa</h3><div class="barras">${p.tempos.map(t => {
      const ref = REF[t.etapa], cls = ref && t.dias >= ref * 2.5 ? "muito" : ref && t.dias >= ref * 1.25 ? "passou" : "";
      return `<div class="barra"><span>${ETAPAS[t.etapa]}</span><span class="trilho"><i class="${cls}" style="width:${t.dias / maxD * 100}%"></i>${ref ? `<u style="left:${ref / maxD * 100}%"></u>` : ""}</span><span>${t.dias} d</span></div>`; }).join("")}</div>
      <p class="mudo" style="font-size:12px;margin:4px 0 0">O traço vertical é a referência da etapa.</p></div>
    ${p.leitura ? `<div class="leitura ${p.tipo === "processo" ? "processo" : ""}"><b>${p.tipo === "processo" ? "Leitura do Jirafalis: o processo" : "Leitura do Jirafalis"}</b><br>${p.leitura}</div>
    ${JF.causa(p, pd)}${JF.escrita(p, pd)}
    <div><h3>Pergunta sugerida para o gestor</h3><textarea id="pergunta">${p.pergunta}</textarea>
      <div class="botoes" style="margin-top:6px"><button class="btn forte" data-acao="enviar">Enviar no Teams/Slack</button><button class="btn" data-acao="copiar">Copiar</button></div></div>
    ${JF.respostas()}`
    : `<div class="leitura" style="border-left-color:var(--acacia)">Andando dentro da referência. Nenhuma pergunta necessária.</div>`}`;
  $("#voltar").onclick = () => selecionar(null);
  if (p.leitura) JF.ligar($("#lado"), p, pd, toast);
  $("#lado").querySelectorAll("[data-acao]").forEach(b => b.onclick = () => toast({
    enviar: "Protótipo: no nível júnior a mensagem vai como rascunho e espera o Liberar do gestor.",
    copiar: (navigator.clipboard?.writeText($("#pergunta").value), "Pergunta copiada."),
  }[b.dataset.acao]));
}
function selecionar(id) { selecionado = id; $("#dica").classList.remove("on"); if (id) { const p = pessoas.find(x => x.id === id); if (aberto !== null && aberto !== p.ti) aberto = null; } desenhar(); lateral(); }
function focar(id) { focoPadrao = focoPadrao?.id === id ? null : PADROES.find(x => x.id === id); selecionado = null; desenhar(); lateral(); }
function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 6000); }
$("#so-casos").onclick = e => { soCasos = !soCasos; e.target.setAttribute("aria-pressed", soCasos); desenhar(); };
$("#sobrio").onclick = e => { sobrio = !sobrio; e.target.setAttribute("aria-pressed", sobrio); desenhar(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") { selecionado = null; focoPadrao = null; desenhar(); lateral(); } });
addEventListener("resize", desenhar);
// âncoras para demonstração: #p0 abre o André, #padrao foca o primeiro padrão, #t3 abre o Checkout
const h = location.hash.slice(1);
if (/^p\d+$/.test(h)) selecionado = h; else if (h === "padrao") focoPadrao = PADROES[0]; else if (/^t\d$/.test(h)) aberto = +h.slice(1);
alarmes(); desenhar(); lateral();
</script>
